<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Лови букет</title>
<style>
  :root {
    --bg: #fbf3e6;
    --ink: #3b2a20;
    --accent: #e0457b;
    --btn: #f1dcc2;
    --btn-ink: #6b4a33;
    --panel: #ffffffee;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #1f1915; --ink: #f4e7d6; --btn: #3a2e25; --btn-ink: #f1dcc2; --panel: #2a221cee;
    }
  }
  :root[data-theme="dark"] {
    --bg: #1f1915; --ink: #f4e7d6; --btn: #3a2e25; --btn-ink: #f1dcc2; --panel: #2a221cee;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink);
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif; overflow: hidden;
    user-select: none; -webkit-user-select: none; touch-action: manipulation; }
  #wrap { height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 8px 16px; gap: 8px; }
  #stage { position: relative; width: 100%; max-width: 420px; aspect-ratio: 2 / 3; max-height: calc(100% - 120px); }
  canvas { width: 100%; height: 100%; display: block; border-radius: 18px; touch-action: none; }
  #pad { width: 100%; max-width: 420px; display: grid; grid-template-columns: 1fr 1fr; gap: 10px 40%; }
  #pad.flip { }
  .b { height: 48px; border: none; border-radius: 24px; background: var(--btn); color: var(--btn-ink);
    font-size: 22px; font-weight: 700; box-shadow: 0 3px 0 #0002; }
  .b:active { transform: translateY(2px); box-shadow: 0 1px 0 #0002; }
  #overlay { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; }
  .card { background: var(--panel); border-radius: 18px; padding: 22px 20px; width: 82%; text-align: center;
    box-shadow: 0 10px 30px #0003; }
  .card h1 { margin: 0 0 6px; font-size: 26px; }
  .card p { margin: 6px 0; line-height: 1.35; font-size: 15px; }
  .big { font-size: 44px; font-weight: 800; color: var(--accent); margin: 4px 0; }
  .go { margin-top: 12px; width: 100%; height: 50px; border: none; border-radius: 14px; background: var(--accent);
    color: #fff; font-size: 18px; font-weight: 700; }
  .go.alt { background: var(--btn); color: var(--btn-ink); }
  .hidden { display: none !important; }
  kbd { background: var(--btn); border-radius: 5px; padding: 1px 6px; font-size: 13px; }
</style>
</head>
<body>
<div id="wrap">
  <div id="stage">
    <canvas id="c" width="400" height="600"></canvas>
    <div id="overlay">
      <div class="card" id="startCard">
        <h1>Лови букет! 💐</h1>
        <p>Цветы скатываются с четырёх полок. Подставляй корзину, пока они не упали.</p>
        <p>Нажимай на угол экрана или на кнопки внизу.<br>На компьютере: <kbd>Q</kbd> <kbd>A</kbd> <kbd>P</kbd> <kbd>L</kbd> или стрелки.</p>
        <p>Три разбитых цветка — и игра окончена.</p>
        <button class="go" id="startBtn">Играть</button>
      </div>
      <div class="card hidden" id="overCard">
        <h1>Игра окончена</h1>
        <div class="big" id="finalScore">0</div>
        <p id="bestLine"></p>
        <button class="go" id="againBtn">Ещё раз</button>
        <button class="go alt hidden" id="sendBtn">Отправить результат в бот</button>
      </div>
    </div>
  </div>
  <div id="pad">
    <button class="b" data-pos="0">↖</button>
    <button class="b" data-pos="2">↗</button>
    <button class="b" data-pos="1">↙</button>
    <button class="b" data-pos="3">↘</button>
  </div>
</div>

  const COLORS = ['#e0457b', '#f2a03d', '#b05cd6', '#ef5350', '#f7c948', '#ff8fb1'];

  let state = 'menu';
  let pos = 0;
  let flowers = [];   // {shelf, step, color, kind, rot}
  let falling = [];   // missed flowers falling to floor
  let sparkles = [];
  let score = 0, misses = 0, tick = 0, interval = 650, lastTick = 0;
  let caughtFlash = 0, bounce = 0;
  let best = 0;
  try { best = +localStorage.getItem('flower_best') || 0; } catch (e) {}

  // ---------- input ----------
  function setPos(p) { if (state === 'play') pos = p; }
  document.querySelectorAll('#pad .b').forEach(b => {
    b.addEventListener('pointerdown', e => { e.preventDefault(); setPos(+b.dataset.pos); });
  });
  cv.addEventListener('pointerdown', e => {
    const r = cv.getBoundingClientRect();
    const x = (e.clientX - r.left) / r.width, y = (e.clientY - r.top) / r.height;
    const right = x > 0.5, bottom = y > 0.45;
    setPos((right ? 2 : 0) + (bottom ? 1 : 0));
  });
  let vert = 0, horiz = 0;
  window.addEventListener('keydown', e => {
    const k = e.key.toLowerCase();
    const map = { q: 0, 'й': 0, a: 1, 'ф': 1, p: 2, 'з': 2, l: 3, 'д': 3 };
    if (k in map) { setPos(map[k]); return; }
    if (k === 'arrowup') vert = 0; else if (k === 'arrowdown') vert = 1;
    else if (k === 'arrowleft') horiz = 0; else if (k === 'arrowright') horiz = 2;
    else if ((k === ' ' || k === 'enter') && state !== 'play') { startGame(); return; }
    else return;
    e.preventDefault();
    setPos(horiz + vert);
  });

  // ---------- game logic ----------
  const $ = id => document.getElementById(id);
  function startGame() {
    state = 'play';
    pos = 0; flowers = []; falling = []; sparkles = [];
    score = 0; misses = 0; tick = 0; interval = 650; lastTick = performance.now();
    $('startCard').classList.add('hidden');
    $('overCard').classList.add('hidden');
  }
  $('startBtn').onclick = startGame;
  $('againBtn').onclick = startGame;
  $('sendBtn').onclick = () => {
    if (tg) tg.sendData(JSON.stringify({ game: 'flowers', score }));
  };

  function gameOver() {
    state = 'over';
    if (score > best) { best = score; try { localStorage.setItem('flower_best', best); } catch (e) {} }
    $('finalScore').textContent = score;
    $('bestLine').textContent = 'Рекорд: ' + best;
    $('sendBtn').classList.toggle('hidden', !(tg && tg.initData !== undefined));
    $('overCard').classList.remove('hidden');
    if (tg && tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('error');
  }

  function arrivalTicks() { return flowers.map(f => tick + (STEPS - f.step)); }

  function doTick() {
    tick++;
    // move
    for (const f of flowers) f.step++;
    // resolve arrivals
    flowers = flowers.filter(f => {
      if (f.step < STEPS) return true;
      if (f.shelf === pos) {
        score++; caughtFlash = 1; bounce = 1;
        const s = SHELVES[f.shelf];
        for (let i = 0; i < 8; i++) sparkles.push({ x: s.x2 + s.side * -6, y: s.y2 + 18, vx: (Math.random() - .5) * 4, vy: -Math.random() * 4 - 1, life: 1, c: f.color });
        if (tg && tg.HapticFeedback) tg.HapticFeedback.impactOccurred('light');
        if (score % 10 === 0) interval = Math.max(230, interval * 0.88);
      } else {
        misses++;
        const s = SHELVES[f.shelf];
        falling.push({ x: s.x2, y: s.y2, vy: 1, vx: -s.side * 0.6, rot: f.rot, color: f.color, kind: f.kind, broken: false, t: 0 });
        if (tg && tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('warning');
        if (misses >= 3) setTimeout(gameOver, 450);
      }
      return false;
    });
    // spawn
    const maxActive = Math.min(2 + Math.floor(score / 8), 7);
    if (flowers.length < maxActive && Math.random() < 0.75) {
      const busy = new Set(arrivalTicks());
      const options = [0, 1, 2, 3].filter(sh => !flowers.some(f => f.shelf === sh && f.step <= 1));
      const arrive = tick + STEPS;
      // keep at least one free tick between arrivals so it's always catchable
      if (options.length && !busy.has(arrive) && !busy.has(arrive - 1) && !busy.has(arrive + 1)) {
        const shelf = options[Math.floor(Math.random() * options.length)];
        flowers.push({ shelf, step: 0, color: COLORS[Math.floor(Math.random() * COLORS.length)], kind: Math.floor(Math.random() * 3), rot: Math.random() * 6 });
      }
    }
  }

  // ---------- drawing ----------
  function css(v) { return getComputedStyle(document.documentElement).getPropertyValue(v).trim(); }

  function drawFlower(x, y, r, color, kind, rot) {
    ctx.save(); ctx.translate(x, y); ctx.rotate(rot);
    if (kind === 0) { // daisy-like
      ctx.fillStyle = color;
      for (let i = 0; i < 6; i++) {
        ctx.beginPath();
        ctx.ellipse(Math.cos(i * Math.PI / 3) * r * .6, Math.sin(i * Math.PI / 3) * r * .6, r * .5, r * .32, i * Math.PI / 3, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.fillStyle = '#ffd54a'; ctx.beginPath(); ctx.arc(0, 0, r * .38, 0, 7); ctx.fill();
    } else if (kind === 1) { // tulip
      ctx.strokeStyle = '#3f8f4a'; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.moveTo(0, r * .2); ctx.lineTo(0, r * 1.1); ctx.stroke();
      ctx.fillStyle = color;
      ctx.beginPath();
      ctx.moveTo(-r * .7, -r * .6); ctx.lineTo(-r * .35, -r * .1); ctx.lineTo(0, -r * .7);
      ctx.lineTo(r * .35, -r * .1); ctx.lineTo(r * .7, -r * .6);
      ctx.quadraticCurveTo(r * .75, r * .45, 0, r * .45);
      ctx.quadraticCurveTo(-r * .75, r * .45, -r * .7, -r * .6);
      ctx.fill();
    } else { // rose
      ctx.fillStyle = color;
      ctx.beginPath(); ctx.arc(0, 0, r * .8, 0, 7); ctx.fill();
      ctx.strokeStyle = '#0000002a'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(0, 0, r * .5, 0.3, 5.2); ctx.stroke();
      ctx.beginPath(); ctx.arc(r * .05, -r * .05, r * .22, 1, 6); ctx.stroke();
      ctx.fillStyle = '#3f8f4a';
      ctx.beginPath(); ctx.ellipse(r * .7, r * .6, r * .35, r * .18, .6, 0, 7); ctx.fill();
    }
    ctx.restore();
  }

  function drawShelf(s) {
    ctx.save();
    ctx.lineCap = 'round';
    ctx.strokeStyle = '#8a5a35'; ctx.lineWidth = 12;
    ctx.beginPath(); ctx.moveTo(s.x1, s.y1 + 14); ctx.lineTo(s.x2, s.y2 + 14); ctx.stroke();
    ctx.strokeStyle = '#b07a4c'; ctx.lineWidth = 6;
    ctx.beginPath(); ctx.moveTo(s.x1, s.y1 + 11); ctx.lineTo(s.x2, s.y2 + 11); ctx.stroke();
    // bracket
    ctx.strokeStyle = '#6d4426'; ctx.lineWidth = 4;
    const bx = s.x1 + (s.x2 - s.x1) * 0.25, by = s.y1 + (s.y2 - s.y1) * 0.25 + 18;
    ctx.beginPath(); ctx.moveTo(bx, by); ctx.lineTo(s.x1 + (s.side < 0 ? 0 : 0), by + 34); ctx.stroke();
    ctx.restore();
  }

  function flowerPos(s, step) {
    const t = (step + 0.5) / STEPS;
    return { x: s.x1 + (s.x2 - s.x1) * t, y: s.y1 + (s.y2 - s.y1) * t };
  }

  function drawBasket(x, y) {
    ctx.save(); ctx.translate(x, y);
    ctx.strokeStyle = '#7b4f2a'; ctx.lineWidth = 4;
    ctx.beginPath(); ctx.arc(0, -4, 22, Math.PI, 0); ctx.stroke();
    ctx.fillStyle = '#c48a52';
    ctx.beginPath(); ctx.moveTo(-28, -4); ctx.lineTo(28, -4); ctx.lineTo(20, 26); ctx.lineTo(-20, 26); ctx.closePath(); ctx.fill();
    ctx.strokeStyle = '#9a6435'; ctx.lineWidth = 2;
    for (let i = 0; i < 3; i++) { ctx.beginPath(); ctx.moveTo(-26 + i * 2, 4 + i * 8); ctx.lineTo(26 - i * 2, 4 + i * 8); ctx.stroke(); }
    for (let i = -2; i <= 2; i++) { ctx.beginPath(); ctx.moveTo(i * 10, -4); ctx.lineTo(i * 8, 26); ctx.stroke(); }
    // flowers peeking out according to score
    const n = Math.min(score, 5);
    for (let i = 0; i < n; i++) drawFlower(-18 + i * 9, -8 - (i % 2) * 5, 6, COLORS[i % COLORS.length], 0, i);
    ctx.restore();
  }

  function drawPlayer() {
    const s = SHELVES[pos];
    const facing = s.side;               // -1 left, 1 right
    const cx = 200, shoulderY = 340;
    const bob = bounce * 6;
    // basket target = end of current shelf
    const bxp = s.x2 + facing * -2, byp = s.y2 + 42 - bob;

    // legs
    ctx.fillStyle = '#2e3d5c';
    ctx.fillRect(cx - 36, 470, 30, 100);
    ctx.fillRect(cx + 6, 470, 30, 100);
    ctx.fillStyle = '#f2f2f2';
    ctx.beginPath(); ctx.ellipse(cx - 22 + facing * 4, 574, 22, 10, 0, 0, 7); ctx.fill();
    ctx.beginPath(); ctx.ellipse(cx + 22 + facing * 4, 574, 22, 10, 0, 0, 7); ctx.fill();

    const near = { x: cx + facing * 50, y: shoulderY + 6 };
    const far = { x: cx - facing * 30, y: shoulderY + 10 };
    arm(far, bxp - facing * 20, byp + 4);
    // torso (black t-shirt)
    ctx.fillStyle = '#17171a';
    ctx.beginPath();
    ctx.moveTo(cx - 58, shoulderY + 8); ctx.lineTo(cx + 58, shoulderY + 8);
    ctx.lineTo(cx + 44, 480); ctx.lineTo(cx - 44, 480); ctx.closePath(); ctx.fill();
    ctx.beginPath(); ctx.ellipse(cx, shoulderY + 10, 58, 22, 0, Math.PI, 0); ctx.fill();

    // arms toward basket: far arm behind the body, near arm in front of the head
    function arm(sh, hx, hy) {
      const mx = (sh.x + hx) / 2 + facing * 10, my = (sh.y + hy) / 2 + 14;
      ctx.lineCap = 'round';
      ctx.strokeStyle = '#17171a'; ctx.lineWidth = 22;
      ctx.beginPath(); ctx.moveTo(sh.x, sh.y); ctx.lineTo(sh.x + (mx - sh.x) * .45, sh.y + (my - sh.y) * .45); ctx.stroke();
      ctx.strokeStyle = '#e6b796'; ctx.lineWidth = 14;
      ctx.beginPath(); ctx.moveTo(sh.x + (mx - sh.x) * .4, sh.y + (my - sh.y) * .4);
      ctx.quadraticCurveTo(mx, my, hx, hy); ctx.stroke();
    }
    // neck + head
    ctx.fillStyle = '#e6b796';
    ctx.fillRect(cx - 14, shoulderY - 30, 28, 30);
    const hw = 112, hh = hw * (head.naturalHeight || 234) / (head.naturalWidth || 220);
    const hx = cx - hw / 2, hy = shoulderY - hh + 8 - bob * .5;
    ctx.save();
    if (facing < 0) { ctx.translate(cx * 2, 0); ctx.scale(-1, 1); }
    if (head.complete && head.naturalWidth) ctx.drawImage(head, hx, hy, hw, hh);
    ctx.restore();
    arm(near, bxp + facing * 6, byp - 4);
    drawBasket(bxp, byp);
  }

  function drawHUD() {
    ctx.fillStyle = '#3b2a20';
    ctx.font = '800 30px -apple-system, Segoe UI, Roboto, sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(score, 200, 44);
    ctx.font = '600 13px -apple-system, Segoe UI, Roboto, sans-serif';
    ctx.fillStyle = '#7a5d48';
    ctx.fillText('рекорд ' + best, 200, 64);
    // misses as broken flowers
    for (let i = 0; i < 3; i++) {
      const x = 330 + i * 24, y = 36;
      ctx.globalAlpha = i < misses ? 1 : .25;
      drawFlower(x, y, 9, i < misses ? '#8d8d8d' : '#e0457b', 0, 0);
    }
    ctx.globalAlpha = 1;
  }

  function drawScene(now) {
    // background (always light "room" so the art reads the same in dark mode)
    const g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, '#fff6ea'); g.addColorStop(1, '#f6e2c9');
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
    // wallpaper dots
    ctx.fillStyle = '#f0d7bd';
    for (let y = 90; y < 560; y += 40) for (let x = 20 + (y / 40 % 2) * 20; x < W; x += 40) { ctx.beginPath(); ctx.arc(x, y, 3, 0, 7); ctx.fill(); }
    // floor
    ctx.fillStyle = '#d9b48d'; ctx.fillRect(0, 560, W, 40);
    ctx.fillStyle = '#c99f74'; ctx.fillRect(0, 560, W, 4);

    SHELVES.forEach(drawShelf);
    for (const f of flowers) {
      const s = SHELVES[f.shelf];
      const p = flowerPos(s, f.step);
      drawFlower(p.x, p.y, 13, f.color, f.kind, f.rot + f.step * 1.2 * -s.side);
    }
    for (const f of falling) {
      if (f.broken) {
        ctx.globalAlpha = Math.max(0, 1 - f.t / 90);
        ctx.fillStyle = f.color;
        for (let i = 0; i < 5; i++) { ctx.beginPath(); ctx.ellipse(f.x - 16 + i * 8, 566 + (i % 2) * 3, 5, 3, i, 0, 7); ctx.fill(); }
        ctx.globalAlpha = 1;
      } else drawFlower(f.x, f.y, 13, f.color, f.kind, f.rot);
    }
    drawPlayer();
    for (const p of sparkles) {
      ctx.globalAlpha = p.life; ctx.fillStyle = p.c;
      ctx.beginPath(); ctx.arc(p.x, p.y, 4, 0, 7); ctx.fill();
    }
    ctx.globalAlpha = 1;
    drawHUD();
  }

  function update(now) {
    if (state === 'play' && now - lastTick >= interval) { lastTick = now; doTick(); }
    for (const f of falling) {
      if (!f.broken) { f.vy += .5; f.y += f.vy; f.x += f.vx; f.rot += .2; if (f.y >= 560) { f.broken = true; f.y = 560; } }
      else f.t++;
    }
    falling = falling.filter(f => !f.broken || f.t < 90);
    for (const p of sparkles) { p.x += p.vx; p.y += p.vy; p.vy += .15; p.life -= .03; }
    sparkles = sparkles.filter(p => p.life > 0);
    bounce *= 0.85;
  }

  function loop(now) { update(now); drawScene(now); requestAnimationFrame(loop); }
  head.onload = () => {};
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
